name: Build

on:
  workflow_dispatch:
  push:
    branches: [main, develop]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (AppImage)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: oven-sh/setup-bun@v2.2.0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: src-tauri

      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun tauri build --bundles appimage

      - uses: actions/upload-artifact@v7
        with:
          name: app-note-linux-appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  windows:
    name: Windows (installeur)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2.2.0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: src-tauri

      - run: bun install --frozen-lockfile
      - run: bun tauri build --bundles nsis

      - uses: actions/upload-artifact@v7
        with:
          name: app-note-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Android NDK
        run: echo "NDK_HOME=${ANDROID_NDK_LATEST_HOME}" >> "$GITHUB_ENV"

      - uses: oven-sh/setup-bun@v2.2.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: src-tauri

      - run: bun install --frozen-lockfile
      - run: bun tauri android init --ci
      - run: bun tauri android build --apk --target aarch64 --ci

      - name: Sign APK
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          build_tools=$(ls -d "${ANDROID_HOME}"/build-tools/* | sort -V | tail -1)
          unsigned=$(find src-tauri/gen/android/app/build/outputs/apk -name '*-release-unsigned.apk' | head -1)
          keystore="${RUNNER_TEMP}/signing.jks"

          if [ -n "${KEYSTORE}" ]; then
            echo "${KEYSTORE}" | base64 --decode > "${keystore}"
          else
            echo "::warning::Secrets ANDROID_KEYSTORE absents : APK signé avec une clé jetable, il ne pourra pas mettre à jour une installation existante."
            KEYSTORE_PASSWORD=$(openssl rand -hex 16)
            KEY_ALIAS=ephemeral
            keytool -genkeypair -keystore "${keystore}" -storepass "${KEYSTORE_PASSWORD}" \
              -alias "${KEY_ALIAS}" -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=CI"
          fi

          "${build_tools}/apksigner" sign --ks "${keystore}" --ks-key-alias "${KEY_ALIAS}" \
            --ks-pass env:KEYSTORE_PASSWORD --out app-note-android-arm64.apk "${unsigned}"
          rm -f "${keystore}"

      - uses: actions/upload-artifact@v7
        with:
          name: app-note-android-apk
          path: app-note-android-arm64.apk
          if-no-files-found: error
