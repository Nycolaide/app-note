name: Build

on:
  workflow_dispatch:
  push:
    branches: [main, develop]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
  VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

jobs:
  prepare:
    name: Vérifications
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.release.outputs.release }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check release
        id: release
        if: github.ref == 'refs/heads/main'
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          tag="v${version}"

          if ! [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::La version ${version} de tauri.conf.json n'est pas une version stable (X.Y.Z)."
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/${tag}" > /dev/null; then
            echo "::notice::La version ${version} est déjà publiée : pas de nouvelle release. Augmente la version dans tauri.conf.json pour en créer une."
            exit 0
          fi

          echo "::notice::Nouvelle release ${tag}."
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux (AppImage, RPM)
    needs: prepare
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: oven-sh/setup-bun@v2.2.0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: src-tauri

      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun tauri build --bundles appimage,rpm

      - uses: actions/upload-artifact@v7
        with:
          name: runote-linux-appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        with:
          name: runote-linux-rpm
          path: src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error

  windows:
    name: Windows (installeur)
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2.2.0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: src-tauri

      - run: bun install --frozen-lockfile
      - run: bun tauri build --bundles nsis

      - uses: actions/upload-artifact@v7
        with:
          name: runote-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  android:
    name: Android (APK)
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6.4.1

      - name: Android NDK
        run: echo "NDK_HOME=${ANDROID_NDK_LATEST_HOME}" >> "$GITHUB_ENV"

      - uses: oven-sh/setup-bun@v2.2.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: src-tauri

      - run: bun install --frozen-lockfile
      - run: bun tauri android init --ci
      - name: Use app icons
        run: cp -r src-tauri/icons/android/. src-tauri/gen/android/app/src/main/res/
      - name: Build APK
        run: |
          for attempt in 1 2 3; do
            bun tauri android build --apk --target aarch64 --ci && exit 0
            echo "::warning::Build Android échoué (tentative ${attempt}/3), nouvel essai dans 60 s."
            sleep 60
          done
          exit 1

      - name: Sign APK
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS }}
          IS_RELEASE: ${{ needs.prepare.outputs.release }}
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          APK_NAME="Runote_${version}_android-arm64.apk"
          echo "APK_NAME=${APK_NAME}" >> "$GITHUB_ENV"
          build_tools=$(ls -d "${ANDROID_HOME}"/build-tools/* | sort -V | tail -1)
          unsigned=$(find src-tauri/gen/android/app/build/outputs/apk -name '*-release-unsigned.apk' | head -1)
          keystore="${RUNNER_TEMP}/signing.jks"

          if [ -n "${KEYSTORE}" ]; then
            echo "${KEYSTORE}" | base64 --decode > "${keystore}"
          elif [ "${IS_RELEASE}" = "true" ]; then
            echo "::error::Secrets ANDROID_KEYSTORE absents : impossible de publier une release Android signée."
            exit 1
          else
            echo "::warning::Secrets ANDROID_KEYSTORE absents : APK signé avec une clé jetable, il ne pourra pas mettre à jour une installation existante."
            KEYSTORE_PASSWORD=$(openssl rand -hex 16)
            KEY_ALIAS=ephemeral
            keytool -genkeypair -keystore "${keystore}" -storepass "${KEYSTORE_PASSWORD}" \
              -alias "${KEY_ALIAS}" -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=CI"
          fi

          "${build_tools}/apksigner" sign --ks "${keystore}" --ks-key-alias "${KEY_ALIAS}" \
            --ks-pass env:KEYSTORE_PASSWORD --out "${APK_NAME}" "${unsigned}"
          rm -f "${keystore}"

      - uses: actions/upload-artifact@v7
        with:
          name: runote-android-apk
          path: ${{ env.APK_NAME }}
          if-no-files-found: error

  release:
    name: Release GitHub
    if: needs.prepare.outputs.release == 'true'
    needs: [prepare, linux, windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release create "${TAG}" release/* \
            --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" --title "${TAG}" --generate-notes
